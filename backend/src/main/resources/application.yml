server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: event-management-system
  data:
    mongodb:
      uri: mongodb://localhost:27017/university_events_db
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: 9a6e8b1c4d7f0e3a5b8c1d4e7f0a3b6c9d2e5f8a1b4c7d0e3f6a9b2c5d8e1f4a
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ./uploads

logging:
  level:
    root: INFO
    com.university.eventmanagement: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.security: INFO
