# Campus Connect Spring Boot Configuration
spring.application.name=university-event-hub-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/campus_connect_db
spring.data.mongodb.auto-index-creation=true

# JWT Security Configurations
campusconnect.jwt.secret=CampusConnectEnterpriseUniversitySecretKeyJWT99887766554433221100
campusconnect.jwt.expiration-ms=86400000

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@campusconnect.edu
spring.mail.password=encrypted_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.campusconnect=DEBUG
